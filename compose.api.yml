services:
  market-contributions:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_PATH: /data/market-contributions.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: 'true'
    ports:
      - 127.0.0.1:8788:8788
    volumes:
      - market-contribution-data:/data

volumes:
  market-contribution-data:
